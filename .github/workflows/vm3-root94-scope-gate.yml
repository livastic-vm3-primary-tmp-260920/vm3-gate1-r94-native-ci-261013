name: VM3 Root94 Protected Scope CI
on:
  pull_request:
    branches:
      - vm3-r94-native-protected-261013
permissions:
  contents: read
jobs:
  vm3-r94-required-scope:
    name: vm3-r94-required-scope
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout target pull request
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Detect scopes using official action and current CLI
        id: scopes
        uses: Mergifyio/gha-mergify-ci@v26
        with:
          action: scopes
          mergify_cli_version: 2026.10.5
          base: ${{ github.base_ref }}
          head: ${{ github.head_ref }}
      - name: Enforce trusted required critical scope
        env:
          CRITICAL: ${{ fromJSON(steps.scopes.outputs.scopes).critical }}
        run: |
          echo "VM3_ROOT94_REQUIRED_CRITICAL=$CRITICAL"
          if [ "$CRITICAL" = "true" ]; then
            echo 'critical scope present: fail the required check'
            exit 1
          fi
          echo 'critical scope absent: pass the required check'